[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "hermes-update-check"
version = "1.2.0"
description = "Safety-first update checker and risk assessor for Hermes Agent (NousResearch/hermes-agent). Never auto-updates; assesses release risk, preflight checks, backup, rollback and post-update health checks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hermes-update-check" }]
keywords = ["hermes", "update", "risk", "release", "safety", "rollback"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "PyYAML>=6.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=5.0",
  "ruff~=0.16.7",
]

[project.urls]
Repository = "https://github.com/xinian5216/hermes-update-check"
Upstream = "https://github.com/NousResearch/hermes-agent"
Issues = "https://github.com/xinian5216/hermes-update-check/issues"

[project.scripts]
hermes-update-check = "hermes_update_check.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_update_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:hermes_update_check.*"]

[tool.coverage.run]
source = ["hermes_update_check"]

[tool.coverage.report]
# Measured 2026-09-15: 83% overall. The gate sits a little below that so a refactor
# still has room, but a module quietly losing its tests fails CI.
fail_under = 80
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 120
target-version = "py39"
exclude = ["build", "dist"]

[tool.ruff.lint]
# Correctness and consistency, not style policing: the S (bandit) and ANN groups are
# deliberately off - this tool spawns subprocesses and opens user-supplied URLs by
# design, and the Chinese output uses full-width punctuation on purpose.
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "SIM", "PLW", "RUF", "UP"]
ignore = [
  "UP045",   # Optional[X] stays: it reads better in long signatures
  "UP035",   # typing.Optional/Dict imports are fine at this size
  "UP006",   # ditto
  "RUF001",  # ambiguous-unicode: full-width punctuation is intentional
  "RUF002",
  "RUF003",
  "RUF012",  # dataclass-style class attributes are intentional
  "PLW1510", # ProcResult inspects returncode itself instead of raising
  "SIM105",  # explicit try/except/pass reads better than contextlib.suppress here
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117", "C401", "RUF005"]
