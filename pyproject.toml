[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "hermes-update-check"
version = "1.1.0"
description = "Safety-first update checker and risk assessor for Hermes Agent (NousResearch/hermes-agent). Never auto-updates; assesses release risk, preflight checks, backup, rollback and post-update health checks."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hermes-update-check" }]
keywords = ["hermes", "update", "risk", "release", "safety", "rollback"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "PyYAML>=6.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]

[project.urls]
Repository = "https://github.com/xinian5216/hermes-update-check"
Upstream = "https://github.com/NousResearch/hermes-agent"
Issues = "https://github.com/xinian5216/hermes-update-check/issues"

[project.scripts]
hermes-update-check = "hermes_update_check.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_update_check"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:hermes_update_check.*"]

[tool.coverage.run]
source = ["hermes_update_check"]
