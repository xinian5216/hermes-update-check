name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]
        exclude:
          # keep the matrix small: the declared floor and a current release
          - os: windows-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test (offline, no network)
        run: python -m pytest -q
      - name: Smoke test the CLI
        run: |
          python -m hermes_update_check version
          python -m hermes_update_check --plain check || true   # exit 10 is a normal verdict

  security:
    name: secret & privacy scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full history: removed-but-committed data counts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Built-in scanner over the full history
        run: python scripts/scan_secrets.py --all-history
      - name: Re-scan the working tree
        run: python scripts/scan_secrets.py .
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
